<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2705B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BB Classroom">
<title>Bookburrow Classroom</title>
<style>
:root{
  /* Bookburrow's own palette — see the parent app's :root */
  --paper:#FFF8F0;        /* bb-cream    */
  --sunken:#FEF3E2;       /* bb-cream-2  */
  --card:#FFFFFF;
  --ink:#3D5A80;          /* bb-navy      — headings and primary text */
  --ink-soft:#6E635A;     /* bb-muted     */
  --line:#E8DFD5;         /* bb-border    */
  --green:#C2705B;        /* bb-terracotta — the accent; kept under the old
                             variable name so every rule inherits it */
  --green-dk:#A85C48;     /* pressed terracotta */
  --sage:#7D9B76;         /* bb-sage      — on the shelf / success */
  --sage-dk:#4F6B49;
  --tan:#D4A76A;          /* bb-tan       — decorative only */
  --amber:#855A18;        /* bb-tan-text  — the readable tan */
  --red:#9E3B2E;          /* overdue, kept clearly darker than terracotta */
  --blue:#3D5A80;
  --radius:14px; --shadow:0 1px 3px rgba(61,90,128,.10), 0 6px 18px rgba(61,90,128,.06);
  --font:"Quicksand","Avenir Next",Avenir,"Segoe UI",sans-serif;
  --sans:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; overscroll-behavior-y:none;
}
h1,h2,h3{font-family:var(--font); font-weight:600; margin:0}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font:inherit; color:inherit}
[hidden]{display:none !important}

/* ---------- layout ---------- */
#authView{
  min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
  padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right));
}
header.topbar{
  position:sticky; top:0; z-index:20; background:var(--green); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
header.topbar h1{font-size:19px; letter-spacing:.2px}
header.topbar .who{font-size:12.5px; opacity:.85; font-family:var(--sans)}
main{
  padding:16px max(14px,env(safe-area-inset-left)) 96px max(14px,env(safe-area-inset-right));
  max-width:720px; margin:0 auto;
}
nav#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--card); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav#tabbar button{
  padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; color:var(--ink-soft); font-weight:600; letter-spacing:.2px;
}
nav#tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav#tabbar button.on{color:var(--green)}
nav#tabbar button .badge{
  position:absolute; transform:translate(16px,-4px); background:var(--red); color:#fff;
  font-size:10px; min-width:17px; height:17px; border-radius:9px; display:grid; place-items:center; padding:0 4px;
}

/* ---------- bits ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:12px}
.grow{flex:1; min-width:0}
.muted{color:var(--ink-soft); font-size:13.5px}
.center{text-align:center}
.sect-title{font-size:12px; text-transform:uppercase; letter-spacing:.9px; color:var(--ink-soft); font-weight:700; margin:22px 0 9px}
.sect-title:first-child{margin-top:0}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--green); color:#fff; border-radius:11px; padding:13px 18px;
  font-weight:650; font-size:15.5px; min-height:48px; width:100%;
}
.btn:active{background:var(--green-dk)}
.btn.ghost{background:transparent; color:var(--green); border:1.5px solid var(--line)}
.btn.amber{background:var(--amber)}
.btn.red{background:var(--red)}
.btn.sm{padding:9px 13px; min-height:40px; font-size:14px; width:auto}
.btn[disabled]{opacity:.5}

label.field{display:block; margin-bottom:12px}
label.field span{display:block; font-size:12.5px; font-weight:650; color:var(--ink-soft); margin-bottom:5px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%; background:#fff; border:1.5px solid var(--line); border-radius:10px;
  padding:12px 13px; font-size:16px; min-height:48px;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green); outline-offset:-1px; border-color:var(--green)}
textarea{min-height:130px; resize:vertical; line-height:1.5}

.pill{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; letter-spacing:.2px}
.pill.in{background:#E9F0E7; color:var(--sage-dk)}
.pill.out{background:#FBF0DD; color:var(--amber)}
.pill.late{background:#F7E2DE; color:var(--red)}

/* book rows */
.list{display:flex; flex-direction:column; gap:9px}
.item{
  display:flex; gap:12px; align-items:flex-start; padding:11px 12px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; text-align:left; width:100%;
}
.item:active{background:var(--sunken)}
.cover{
  width:42px; height:62px; flex:0 0 42px; border-radius:4px; object-fit:cover;
  background:linear-gradient(150deg,#F3E4D2,#E0C9A8); box-shadow:0 1px 2px rgba(61,90,128,.16);
}
.cover.ph{display:grid; place-items:center; font-family:var(--font); font-weight:600; font-size:19px; color:#A98A5F}
.ttl{font-weight:650; font-size:15px; line-height:1.28}
.sub{font-size:13px; color:var(--ink-soft); margin-top:2px}
.meta{font-size:12.5px; margin-top:5px}

/* student picker grid */
.namegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:9px}
.namebtn{
  background:var(--card); border:1.5px solid var(--line); border-radius:12px;
  padding:15px 11px; min-height:62px; font-weight:650; font-size:15px; text-align:left; line-height:1.2;
}
.namebtn:active{background:var(--green); color:#fff; border-color:var(--green)}
.namegrid .namebtn{font-family:var(--sans)}
.namebtn small{display:block; font-weight:500; font-size:11.5px; color:var(--ink-soft); margin-top:3px}
.namebtn:active small{color:rgba(255,255,255,.8)}
.namebtn.full{opacity:.45}

/* scanner */
#reader{width:100%; border-radius:14px; overflow:hidden; background:#2A2522; min-height:230px}
#reader video{width:100% !important; display:block}
.scanhero{
  border:2px dashed var(--line); border-radius:var(--radius); padding:30px 18px;
  text-align:center; background:#fff;
}
.scanhero svg{width:52px;height:52px;stroke:var(--green);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* sheet / modal */
.sheet-wrap{position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; justify-content:center}
.sheet-bg{position:absolute; inset:0; background:rgba(61,90,128,.38)}
.sheet{
  position:relative; background:var(--paper); width:100%; max-width:640px;
  border-radius:20px 20px 0 0; max-height:92dvh; overflow-y:auto;
  padding:8px max(16px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom));
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 14px}
.sheet h2{font-size:20px; margin-bottom:4px}

#toast{
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(20px);
  background:#33465E; color:#fff; padding:12px 18px; border-radius:11px; font-size:14.5px;
  font-weight:600; z-index:90; opacity:0; pointer-events:none; transition:.22s; max-width:88vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%)}
#toast.bad{background:var(--red)}
#toast.good{background:var(--sage-dk)}

/* bins */
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;display:inline-block}
.binchip{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650;
  padding:3px 9px 3px 7px; border-radius:99px; background:#F1EADD; color:var(--ink-soft);
}
.seg{display:flex; background:var(--sunken); border-radius:11px; padding:3px; gap:3px; margin-bottom:13px}
.seg button{flex:1; padding:9px 6px; border-radius:9px; font-size:14px; font-weight:650; color:var(--ink-soft)}
.seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.10)}
.swatches{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:14px}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--ink)}
.putback{
  text-align:center; padding:22px 14px 10px;
}
.putback .big{
  font-family:var(--font); font-size:clamp(23px,7.2vw,32px); line-height:1.18; margin:10px 0 4px;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;
  overflow-wrap:anywhere;
}
.empty{text-align:center; padding:40px 20px; color:var(--ink-soft)}
.empty strong{display:block; font-family:var(--font); font-size:19px; color:var(--ink); margin-bottom:6px}
.toggle{
  width:52px;height:31px;border-radius:99px;background:#DFD3C3;position:relative;
  flex:0 0 52px;transition:background .18s;
}
.toggle.on{background:var(--green)}
.toggle span{
  position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s;
}
.toggle.on span{transform:translateX(21px)}
.spinner{
  width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{font-family:var(--font); font-weight:700; font-size:34px; text-align:center;
  color:var(--ink); letter-spacing:-.3px; margin-bottom:2px}
.brandline{
  text-align:center; font-family:var(--font); font-weight:600; font-size:15px;
  letter-spacing:3.5px; text-transform:uppercase; color:var(--green); margin-bottom:10px;
}
.brandsub{text-align:center; color:var(--ink-soft); margin-bottom:26px; font-size:14.5px}
.familytag{
  text-align:center; font-size:12px; color:var(--ink-soft); margin-top:20px;
}
.familytag a{color:var(--green); font-weight:600}
</style>
</head>
<body>

<!-- ============ SIGN IN ============ -->
<section id="authView">
  <div style="max-width:420px;margin:0 auto;width:100%">
    <div class="brand">Bookburrow</div>
    <div class="brandline">Classroom</div>
    <div class="brandsub">The classroom shelf, checked in and out.</div>
    <div class="card pad">
      <label class="field"><span>Email</span>
        <input type="email" id="authEmail" autocomplete="email" inputmode="email" placeholder="you@school.org"></label>
      <label class="field"><span>Password</span>
        <input type="password" id="authPass" autocomplete="current-password" placeholder="At least 6 characters"></label>
      <label class="field" id="nameField" hidden><span>Your name</span>
        <input type="text" id="authName" placeholder="Ms. Rivera"></label>
      <button class="btn" id="authGo">Sign in</button>
      <p class="muted center" style="margin:14px 0 0">
        <span id="authSwapTxt">New here?</span>
        <button id="authSwap" style="color:var(--green);font-weight:700;text-decoration:underline">Create an account</button>
      </p>
    </div>
    <p class="muted center" style="margin-top:18px">Each teacher's books and class list stay private to their own account.</p>
    <p class="familytag">Part of <a href="../">Bookburrow</a> &middot; the classroom burrow</p>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="mainView" hidden>
  <header class="topbar">
    <div><h1 id="barTitle">Scan</h1><div class="who" id="barWho"></div></div>
    <div style="text-align:right;font-family:var(--font);font-weight:600;font-size:12px;
                letter-spacing:2px;text-transform:uppercase;opacity:.72">Bookburrow</div>
  </header>

  <main>
    <section id="view-scan" class="view"></section>
    <section id="view-books" class="view" hidden></section>
    <section id="view-students" class="view" hidden></section>
    <section id="view-due" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <nav id="tabbar">
    <button data-tab="scan" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><path d="M3 12h18"/></svg>Scan</button>
    <button data-tab="books">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Books</button>
    <button data-tab="students">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>Class</button>
    <button data-tab="due">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Due</button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.56V21a2 2 0 11-4 0v-.09A1.7 1.7 0 008 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 003.6 15a1.7 1.7 0 00-1.56-1H2a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.56V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9v0a1.7 1.7 0 001.56 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.51 1z"/></svg>Setup</button>
  </nav>
</div>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ============================================================
   Bookburrow Classroom  —  classroom library check-in / check-out
   A child of Bookburrow: same palette, same type, its own app.
   Single file. Vanilla JS. Supabase backend.
   ============================================================ */

const SUPABASE_URL = 'https://rdkhgsiqmdzhmkduyiah.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YKl41V9FpU6LbXPhJtK5cQ_fMSZcyV_';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  user: null,
  teacher: null,
  books: [],       // all books for this teacher
  bins: [],        // shelf bins / baskets
  students: [],    // roster
  loans: [],       // OPEN loans only (returned_at is null)
  history: [],     // finished checkouts, newest first
  tab: 'scan',
  authMode: 'in',
};

/* ---------------- tiny helpers ---------------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg, kind='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = kind, 2600);
}
function clearToast() {
  clearTimeout(toastTimer);
  const t = $('#toast');
  if (t) t.className = '';
}
/* ---------------- sound ----------------
   iPhone Safari has no vibration, so a tone is the only feedback that reaches
   the teacher's hand. Web Audio needs a user gesture before it will make noise,
   so the first tap anywhere in the app wakes it up. */
let audioCtx = null;
let soundOn  = true;
try { soundOn = localStorage.getItem('cs_sound') !== 'off'; } catch (e) {}

function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
document.addEventListener('touchstart', unlockAudio, { passive: true });
document.addEventListener('click', unlockAudio, { passive: true });

const TONES = {
  read:   [[1046.5, 0, 0.07]],                              // barcode caught — a short tick
  added:  [[659.3, 0, 0.10], [880.0, 0.09, 0.16]],          // rising — it is in the library
  out:    [[587.3, 0, 0.10], [784.0, 0.09, 0.10], [1046.5, 0.18, 0.20]],  // three rising — off it goes
  back:   [[880.0, 0, 0.10], [587.3, 0.10, 0.22]],          // falling — home again
  error:  [[233.1, 0, 0.16], [196.0, 0.15, 0.28]],          // low double — something is wrong
};

function play(kind) {
  if (!soundOn) return;
  unlockAudio();
  if (!audioCtx) return;
  const notes = TONES[kind];
  if (!notes) return;
  const now = audioCtx.currentTime;
  notes.forEach(([freq, at, len]) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = kind === 'error' ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(freq, now + at);
    gain.gain.setValueAtTime(0.0001, now + at);
    gain.gain.exponentialRampToValueAtTime(kind === 'error' ? 0.22 : 0.30, now + at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + at + len);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + at);
    osc.stop(now + at + len + 0.02);
  });
}

/* Sound plus vibration — whichever the phone actually supports */
function buzz(ms = 40, tone) {
  try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {}
  if (tone) play(tone);
}

function setSound(on) {
  soundOn = on;
  try { localStorage.setItem('cs_sound', on ? 'on' : 'off'); } catch (e) {}
  if (on) play('added');
}

function fullName(s) { return (s.first_name + ' ' + (s.last_name || '')).trim(); }

function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

function dueLabel(iso) {
  const due = new Date(iso); due.setHours(0,0,0,0);
  const n = daysBetween(startOfToday(), due);
  if (n < 0)  return { text: `${-n} day${-n===1?'':'s'} overdue`, cls: 'late', late: true };
  if (n === 0) return { text: 'Due today', cls: 'out', late: false };
  if (n === 1) return { text: 'Due tomorrow', cls: 'out', late: false };
  return { text: `Due in ${n} days`, cls: 'out', late: false };
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

/* Normalize a scanned barcode into a usable ISBN string */
function cleanISBN(raw) {
  let s = String(raw || '').replace(/[^0-9Xx]/g, '').toUpperCase();
  if (s.length === 18) s = s.slice(0, 13);   // EAN-13 + 5-digit price add-on
  if (s.length === 15) s = s.slice(0, 10);
  return s;
}
function isbn10to13(s) {
  if (s.length !== 10) return s;
  const core = '978' + s.slice(0, 9);
  let sum = 0;
  for (let i = 0; i < 12; i++) sum += (+core[i]) * (i % 2 ? 3 : 1);
  return core + ((10 - (sum % 10)) % 10);
}

/* ---------------- derived data ---------------- */
const BIN_COLORS = {
  green:'#3F6B52', teal:'#2F6E6B', blue:'#3B6382', purple:'#6B5080',
  plum:'#8A4C63', red:'#B4442E', amber:'#C9873A', brown:'#7A5C3E',
};
function binById(id) { return state.bins.find(b => b.id === id); }
function binColor(bin) { return BIN_COLORS[bin && bin.color] || BIN_COLORS.green; }
function binChip(binId) {
  if (!state.bins.length) return '';           // feature is off until a teacher names a spot
  const bin = binById(binId);
  if (!bin) return `<span class="binchip"><span class="dot" style="background:#C9BFAC"></span>Not sorted</span>`;
  return `<span class="binchip"><span class="dot" style="background:${binColor(bin)}"></span>${esc(bin.name)}</span>`;
}
function binOptions(selected) {
  return `<option value="">— Not sorted yet —</option>` +
    state.bins.map(b => `<option value="${b.id}" ${b.id === selected ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
}
function booksInBin(binId) {
  return binId === null ? state.books.filter(b => !b.bin_id) : state.books.filter(b => b.bin_id === binId);
}

function openLoanForBook(bookId) { return state.loans.find(l => l.book_id === bookId); }
function openLoansForStudent(sid) { return state.loans.filter(l => l.student_id === sid); }
function historyForStudent(sid) { return state.history.filter(l => l.student_id === sid); }
function timesBorrowed(bookId) {
  return state.history.filter(l => l.book_id === bookId).length + (openLoanForBook(bookId) ? 1 : 0);
}
function daysKept(loan) {
  const out = new Date(loan.checked_out_at), back = new Date(loan.returned_at);
  const n = Math.max(1, Math.round((back - out) / 86400000));
  return `${n} day${n === 1 ? '' : 's'}`;
}
function studentById(id) { return state.students.find(s => s.id === id); }
function bookById(id) { return state.books.find(b => b.id === id); }
function overdueLoans() {
  const today = startOfToday();
  return state.loans.filter(l => new Date(l.due_at) < today);
}

async function loadAll() {
  const [t, s, b, l, n] = await Promise.all([
    db.from('teachers').select('*').eq('id', state.user.id).maybeSingle(),
    db.from('students').select('*').order('last_name').order('first_name'),
    db.from('books').select('*').order('title'),
    db.from('loans').select('*').order('checked_out_at', { ascending: false }),
    db.from('bins').select('*').order('sort_order').order('name'),
  ]);

  if (!t.data) {
    // Safety net in case the signup trigger did not fire
    const ins = await db.from('teachers').insert({
      id: state.user.id,
      display_name: state.user.user_metadata?.display_name || state.user.email.split('@')[0],
    }).select().single();
    state.teacher = ins.data;
  } else {
    state.teacher = t.data;

  state.students = s.data || [];
  state.books    = b.data || [];
  state.bins     = n.data || [];

/* One fetch, two lists: what is out now, and everything already returned */
function splitLoans(all) {
  state.loans   = all.filter(l => !l.returned_at);
  state.history = all.filter(l =>  l.returned_at);
}

async function refresh() {
  const [s, b, l, n] = await Promise.all([
    db.from('students').select('*').order('last_name').order('first_name'),
    db.from('books').select('*').order('title'),
    db.from('loans').select('*').order('checked_out_at', { ascending: false }),
    db.from('bins').select('*').order('sort_order').order('name'),
  ]);
  state.students = s.data || [];
  state.books    = b.data || [];
  state.bins     = n.data || [];
  splitLoans(l.data || []);
  render();
}

/* ---------------- book lookup (Open Library, then Google Books) ---------------- */
async function lookupISBN(isbn) {
  const tries = isbn.length === 10 ? [isbn, isbn10to13(isbn)] : [isbn];

  for (const code of tries) {
    try {
      const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${code}&format=json&jscmd=data`);
      const j = await r.json();
      const d = j['ISBN:' + code];
      if (d && d.title) return {
        title:  d.title,
        author: (d.authors || []).map(a => a.name).join(', '),
        cover:  d.cover ? (d.cover.medium || d.cover.large || d.cover.small) : null,
      };
    } catch (e) { /* offline or blocked — fall through */ }
  }

  for (const code of tries) {
    try {
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${code}`);
      const j = await r.json();
      const v = j.items && j.items[0] && j.items[0].volumeInfo;
      if (v && v.title) return {
        title:  v.title + (v.subtitle ? ': ' + v.subtitle : ''),
        author: (v.authors || []).join(', '),
        cover:  v.imageLinks ? (v.imageLinks.thumbnail || '').replace(/^http:/, 'https:') : null,
      };
    } catch (e) { /* ignore */ }
  }
  return null;
}

async function checkOut(bookId, studentId) {
  const due = new Date();
  due.setDate(due.getDate() + (state.teacher.checkout_days || 14));
  due.setHours(23, 59, 0, 0);

  const { error } = await db.from('loans').insert({
    teacher_id: state.user.id,
    book_id: bookId,
    student_id: studentId,
    due_at: due.toISOString(),
  });

  if (error) {
    const m = error.message || '';
    play('error');
    if (m.includes('CHECKOUT_LIMIT_REACHED'))
      toast(`That student already has ${state.teacher.max_books} book${state.teacher.max_books===1?'':'s'} out`, 'bad');
    else if (m.includes('loans_one_open_per_book'))
      toast('That book is already checked out', 'bad');
    else toast(m, 'bad');
    return false;
  }

  const st = studentById(studentId), bk = bookById(bookId);
  buzz(50, 'out');
  toast(`${bk.title} → ${st.first_name}, back ${fmtDate(due)}`, 'good');
  await refresh();
  return true;
}

async function checkIn(bookId) {
  const { error } = await db.from('loans')
    .update({ returned_at: new Date().toISOString() })
    .eq('book_id', bookId).is('returned_at', null);

  if (error) { play('error'); toast(error.message, 'bad'); return false; }
  buzz(50, 'back');
  const book = bookById(bookId);
  await refresh();
  showPutBack(book);
  return true;
}

/* ---------------- the scan flow ---------------- */
let scanner = null, scanning = false, lastCode = '', lastCodeAt = 0;

function isStandalone() {
  return window.navigator.standalone === true ||
         (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

function setScanStatus(html, kind) {
  const el = $('#scanStatus');
  if (!el) return;
  if (!html) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.style.borderColor = kind === 'bad' ? 'var(--red)' : 'var(--line)';
  el.innerHTML = html;
}

/* Everything that can go wrong here gets SAID, never swallowed. */
function scanFailed(err) {
  const name = (err && (err.name || err.message)) || 'Unknown problem';
  const box  = $('#reader');
  if (box) box.hidden = true;
  const idle = $('#scanIdle'); if (idle) idle.hidden = false;
  const stop = $('#scanStop'); if (stop) stop.hidden = true;
  scanning = false; scanner = null;

  let advice;
  if (/NotAllowedError|Permission|denied/i.test(name)) {
    advice = isStandalone()
      ? `Your iPhone will not give the camera to an app opened from the home screen until you allow it once in Safari. <b>Open the link in Safari</b>, tap Open the camera there and tap Allow, then come back to this icon.`
      : `Camera access was blocked. On iPhone: tap the <b>aA</b> button in the address bar &rarr; Website Settings &rarr; Camera &rarr; Allow. Then reload.`;
  } else if (/NotFoundError|no camera|Requested device not found/i.test(name)) {
    advice = `No camera was found on this device.`;
  } else if (/NotReadableError|TrackStartError|in use/i.test(name)) {
    advice = `Another app is using the camera. Close it and try again.`;
  } else if (/secure|https/i.test(name)) {
    advice = `The camera only works over a secure (https) link.`;
  } else {
    advice = `The camera did not start.`;
  }

  setScanStatus(`<strong style="color:var(--red)">Camera trouble</strong>
    <div class="muted" style="margin:6px 0 10px">${advice}</div>
    <button class="btn sm" style="width:100%" onclick="showManualISBN()">Type the ISBN instead</button>
    <div class="muted" style="margin-top:10px;font-size:11.5px">Technical detail: ${esc(String(name))}</div>`, 'bad');
}

async function startScan() {
  if (scanning) return;
  const box = $('#reader');
  if (!box) return;

  setScanStatus(`<div class="row"><span class="spinner" style="border-color:rgba(0,0,0,.15);border-top-color:var(--green)"></span>
    <span class="muted">Starting the camera&hellip;</span></div>`);

  // 1. Ask for the camera outright. iPhone needs this, and it gives a real error if refused.
  try {
    const probe = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
    probe.getTracks().forEach(t => t.stop());
  } catch (e) {
    return scanFailed(e);
  }

  box.hidden = false;
  const idle = $('#scanIdle'); if (idle) idle.hidden = true;

  const config = { fps: 10, qrbox: { width: 260, height: 150 }, aspectRatio: 1.4 };
  const formats = {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
    ],
    verbose: false,
  };

  // 2. Try the back camera by name, then by device id, then anything at all.
  const attempts = [
    () => scanner.start({ facingMode: 'environment' }, config, onScanned, () => {}),
    async () => {
      const cams = await Html5Qrcode.getCameras();
      if (!cams || !cams.length) throw new Error('NotFoundError');
      const back = cams.find(c => /back|rear|environment/i.test(c.label)) || cams[cams.length - 1];
      return scanner.start(back.id, config, onScanned, () => {});
    },
    () => scanner.start({ facingMode: 'user' }, config, onScanned, () => {}),
  ];

  let lastErr;
  for (const attempt of attempts) {
    try {
      scanner = new Html5Qrcode('reader', formats);
      await attempt();
      scanning = true;
      const stop = $('#scanStop'); if (stop) stop.hidden = false;
      setScanStatus(`<div class="muted">Point at the barcode on the back of the book. Hold steady &mdash; your phone buzzes when it reads.</div>
        <button class="btn ghost sm" style="width:100%;margin-top:10px" onclick="showManualISBN()">Type the ISBN instead</button>`);
      return;
    } catch (e) {
      lastErr = e;
      try { scanner && scanner.clear(); } catch (x) {}
      scanner = null;
    }
  }
  scanFailed(lastErr);
}

async function stopScan() {
  if (!scanning || !scanner) return;
  try { await scanner.stop(); scanner.clear(); } catch (e) {}
  scanning = false;
  scanner = null;
  const box = $('#reader');
  if (box) box.hidden = true;
  const idle = $('#scanIdle'); if (idle) idle.hidden = false;
  const stop = $('#scanStop'); if (stop) stop.hidden = true;
  setScanStatus('');
}

function onScanned(text) {
  const now = Date.now();
  if (text === lastCode && now - lastCodeAt < 3000) return;  // ignore rapid repeats
  lastCode = text; lastCodeAt = now;
  buzz(60, 'read');
  handleCode(cleanISBN(text));
}

/* What happens once we have an ISBN — scanned or typed */
async function handleCode(isbn) {
  if (!isbn || isbn.length < 8) { play('error'); return toast('That barcode is not a book ISBN', 'bad'); }

  const alt = isbn.length === 10 ? isbn10to13(isbn) : null;
  const book = state.books.find(b => b.isbn === isbn || (alt && b.isbn === alt));

  if (book) return showBookSheet(book.id);

  // Not in this library yet — offer to add it
  openSheet(`
    <h2>New book</h2>
    <p class="muted" style="margin:2px 0 16px">ISBN ${esc(isbn)} — looking it up&hellip;</p>
    <div class="center" style="padding:26px"><span class="spinner" style="border-color:rgba(0,0,0,.15);border-top-color:var(--green)"></span></div>
  `);

  const info = await lookupISBN(isbn) || { title: '', author: '', cover: null };
  openSheet(`
    <h2>Add to your library</h2>
    <p class="muted" style="margin:2px 0 16px">ISBN ${esc(isbn)}${info.title ? '' : ' — no match found online, type it in'}</p>
    <div class="row" style="align-items:flex-start;margin-bottom:14px">
      ${info.cover ? `<img class="cover" style="width:62px;flex-basis:62px;height:92px" src="${esc(info.cover)}" alt="">` : ''}
      <div class="grow">
        <label class="field"><span>Title</span><input type="text" id="nbTitle" value="${esc(info.title)}"></label>
        <label class="field"><span>Author</span><input type="text" id="nbAuthor" value="${esc(info.author)}"></label>
      </div>
    </div>
    <label class="field"><span>Reading level (optional)</span>
      <input type="text" id="nbLevel" placeholder="e.g. Y, 4.2, Realistic Fiction"></label>
    ${state.bins.length ? `<label class="field"><span>Where does it go on the shelf?</span>
      <select id="nbBin">${binOptions(null)}</select></label>` : ''}
    <div class="stack">
      <button class="btn" id="nbSave">Add to library</button>
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
    </div>
  `);

  $('#nbSave').addEventListener('click', async () => {
    const title = $('#nbTitle').value.trim();
    if (!title) return toast('A title is required', 'bad');
    const created = await addBook({
      isbn,
      title,
      author: $('#nbAuthor').value.trim(),
      reading_level: $('#nbLevel').value.trim() || null,
      bin_id: ($('#nbBin') ? $('#nbBin').value : '') || null,
      cover_url: info.cover || null,
    });
    if (created) { buzz(50, 'added'); toast('Added to your library', 'good'); showBookSheet(created.id); }
  });
}

/* ---------------- book sheet: check out / check in ---------------- */
function coverHTML(b, big) {
  const size = big ? 'width:62px;flex-basis:62px;height:92px' : '';
  if (b.cover_url) return `<img class="cover" style="${size}" src="${esc(b.cover_url)}" alt="" loading="lazy">`;
  return `<div class="cover ph" style="${size}">${esc((b.title || '?')[0])}</div>`;
}

function showBookSheet(bookId) {
  const b = bookById(bookId);
  if (!b) return;
  const loan = openLoanForBook(bookId);

  let body;
  if (loan) {
    const st = studentById(loan.student_id);
    const d  = dueLabel(loan.due_at);
    body = `
      <div class="pill ${d.cls}" style="margin-bottom:10px">Checked out</div>
      <p style="margin:0 0 4px;font-size:15px">
        <strong>${esc(st ? fullName(st) : 'Unknown student')}</strong> has had this since ${fmtDate(loan.checked_out_at)}.
      </p>
      <p class="muted" style="margin:0 0 18px;${d.late ? 'color:var(--red);font-weight:700' : ''}">${d.text} &middot; due ${fmtDate(loan.due_at)}</p>
      <div class="stack">
        <button class="btn" id="bkIn">Check it back in</button>
        <button class="btn ghost" onclick="closeSheet()">Not now</button>
      </div>`;
  } else {
    body = `
      <div class="pill in" style="margin-bottom:10px">On the shelf</div>
      <div class="stack" style="margin-top:8px">
        <button class="btn" id="bkOut">Check out to a student</button>
        <button class="btn ghost" onclick="closeSheet()">Close</button>
      </div>`;
  }

  openSheet(`
    <div class="row" style="align-items:flex-start;margin-bottom:16px">
      ${coverHTML(b, true)}
      <div class="grow">
        <h2 style="font-size:19px">${esc(b.title)}</h2>
        <div class="muted">${esc(b.author || 'Unknown author')}</div>
        ${b.reading_level ? `<div class="muted">Level ${esc(b.reading_level)}</div>` : ''}
        ${b.isbn ? `<div class="muted" style="font-size:12px">ISBN ${esc(b.isbn)}</div>` : ''}
        ${binChip(b.bin_id) ? `<div style="margin-top:6px">${binChip(b.bin_id)}</div>` : ''}
        ${(() => {
          const n = timesBorrowed(bookId);
          if (!n) return `<div class="muted" style="margin-top:6px">Not borrowed yet</div>`;
          const last = state.history.filter(l => l.book_id === bookId)[0];
          const who  = last ? studentById(last.student_id) : null;
          return `<div class="muted" style="margin-top:6px">Borrowed ${n} time${n === 1 ? '' : 's'}${
            who ? ` &middot; last back from ${esc(who.first_name)} ${fmtDate(last.returned_at)}` : ''}</div>`;
        })()}
      </div>
    </div>
    ${state.bins.length ? `<label class="field"><span>Shelf spot</span>
      <select id="bkBin">${binOptions(b.bin_id)}</select></label>` : ''}
    ${body}
    <p class="center" style="margin-top:18px">
      <button class="muted" style="text-decoration:underline" id="bkDel">Remove this book from the library</button>
    </p>
  `);

  $('#bkBin')?.addEventListener('change', e => setBookBin(bookId, e.target.value));
  const inBtn = $('#bkIn'), outBtn = $('#bkOut');
  if (inBtn)  inBtn.addEventListener('click', async () => { closeSheet(); await checkIn(bookId); });
  if (outBtn) outBtn.addEventListener('click', () => showStudentPicker(bookId));
  $('#bkDel').addEventListener('click', () => {
    if (openLoanForBook(bookId)) return toast('Check it in first', 'bad');
    openSheet(`
      <h2>Remove this book?</h2>
      <p class="muted" style="margin:4px 0 18px">${esc(b.title)} will be deleted from your library. Its checkout history goes too.</p>
      <div class="stack">

function showStudentPicker(bookId) {

/* ---------------- student sheets ---------------- */
const HISTORY_PAGE = 20;
let historyShown = HISTORY_PAGE;

function showStudentSheet(id, keepPage) {
  if (!keepPage) historyShown = HISTORY_PAGE;

  const s     = studentById(id);
  const loans = openLoansForStudent(id);
  const past  = historyForStudent(id);

  const rows = loans.length ? loans.map(l => {
    const b = bookById(l.book_id) || { title: 'Unknown book' };
    const d = dueLabel(l.due_at);
    return `<button class="item" onclick="closeSheet(); showBookSheet('${l.book_id}')">
      ${coverHTML(b)}
      <div class="grow">
        <div class="ttl">${esc(b.title)}</div>
        <div class="sub">${esc(b.author || '')}</div>
        <div class="meta"><span class="pill ${d.cls}">${d.text}</span></div>
      </div></button>`;
  }).join('') : `<p class="muted">Nothing checked out right now.</p>`;

  const shown = past.slice(0, historyShown);
  const pastRows = past.length ? shown.map(l => {
    const b = bookById(l.book_id) || { title: 'Unknown book' };
    return `<button class="item" onclick="closeSheet(); showBookSheet('${l.book_id}')">
      ${coverHTML(b)}
      <div class="grow">
        <div class="ttl">${esc(b.title)}</div>
        <div class="sub">${esc(b.author || '')}</div>
        <div class="meta muted">Returned ${fmtDate(l.returned_at)} &middot; kept ${daysKept(l)}</div>
      </div></button>`;
  }).join('') : `<p class="muted">No finished books yet. They will show up here as books come back.</p>`;

  openSheet(`
    <h2>${esc(fullName(s))}</h2>
    <p class="muted" style="margin:2px 0 16px">
      ${loans.length} of ${state.teacher.max_books} out now &middot;
      <b>${past.length} finished</b>
    </p>

    <div class="sect-title" style="margin-top:0">Out now</div>
    <div class="list">${rows}</div>

    <div class="sect-title">Books they have finished${past.length ? ` (${past.length})` : ''}</div>
    <div class="list">${pastRows}</div>
    ${past.length > shown.length
      ? `<button class="btn ghost sm" style="width:100%;margin-top:10px" id="moreHist">Show ${Math.min(HISTORY_PAGE, past.length - shown.length)} more</button>`
      : ''}

    <p class="center" style="margin-top:22px">
      <button class="muted" style="text-decoration:underline" onclick="deleteStudent('${id}')">Remove from class list</button>
    </p>
    <button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">Close</button>
  `);

  $('#moreHist')?.addEventListener('click', () => {
    historyShown += HISTORY_PAGE;
    showStudentSheet(id, true);
  });
}

function segHTML() {
  return `<div class="seg">

  </div>`;
}

function renderBooks() {
  if (!state.bins.length) booksMode = 'all';   // nothing to browse by
  const seg = state.bins.length ? segHTML() : '';
  if (booksMode === 'bins') return seg + renderByBin();

  const q = bookQuery.toLowerCase();
  let list = state.books.filter(b =>
    !q || (b.title + ' ' + (b.author || '')).toLowerCase().includes(q));
  if (bookFilter === 'in')  list = list.filter(b => !openLoanForBook(b.id));
  if (bookFilter === 'out') list = list.filter(b =>  openLoanForBook(b.id));

  return seg + `
    <input type="text" id="bookSearch" placeholder="Search title or author" value="${esc(bookQuery)}">
    <div class="row" style="margin:12px 0 14px;gap:8px">
      ${['all','in','out'].map(f => `
        <button class="btn sm ${bookFilter === f ? '' : 'ghost'}" style="flex:1" data-filter="${f}">
          ${f === 'all' ? 'All' : f === 'in' ? 'On shelf' : 'Checked out'}</button>`).join('')}

      ? `<div class="list">${list.map(bookRow).join('')}</div>`
      : `<div class="empty"><strong>Nothing here</strong>${state.books.length ? 'Try a different search or filter.' : 'Scan a book to add your first one.'}</div>`}
  `;
}

/* Browse the shelf one bin at a time */
function renderByBin() {
  if (openBin !== undefined) {
    const bin   = binById(openBin);
    const books = booksInBin(openBin);
    const out   = books.filter(b => openLoanForBook(b.id)).length;
    return `
      <button class="btn ghost sm" id="binBack" style="margin-bottom:14px">&larr; All spots</button>
      <div class="card pad" style="margin-bottom:14px">
        <div class="row">
          <span class="dot" style="width:16px;height:16px;flex-basis:16px;background:${bin ? binColor(bin) : '#C9BFAC'}"></span>
          <div class="grow"><strong style="font-size:17px">${esc(bin ? bin.name : 'Not sorted')}</strong>
            <div class="muted">${books.length} book${books.length === 1 ? '' : 's'} &middot; ${out} out right now</div></div>
        </div>
      </div>
      ${books.length
        ? `<div class="list">${books.map(bookRow).join('')}</div>`
        : `<div class="empty"><strong>Nothing here yet</strong>Scan a book and pick this spot.</div>`}`;
  }

  if (!state.bins.length) return `
    <div class="empty">
      <strong>No shelf spots yet</strong>
      Name your bins or sections once, then every book knows where it goes back.
    </div>
    <button class="btn" onclick="showAddBins()">Set up shelf spots</button>`;

  const rows = state.bins.map(bin => {
    const books = booksInBin(bin.id);
    const out   = books.filter(b => openLoanForBook(b.id)).length;
    return `<button class="item" data-bin="${bin.id}">
      <span class="dot" style="width:16px;height:16px;flex-basis:16px;margin-top:5px;background:${binColor(bin)}"></span>
      <div class="grow">
        <div class="ttl">${esc(bin.name)}</div>
        <div class="sub">${books.length} book${books.length === 1 ? '' : 's'}${out ? ` · ${out} out` : ''}</div>
      </div></button>`;
  }).join('');

  const loose = booksInBin(null).length;
  const looseRow = loose ? `<button class="item" data-bin="__none">
      <span class="dot" style="width:16px;height:16px;flex-basis:16px;margin-top:5px;background:#C9BFAC"></span>
      <div class="grow"><div class="ttl">Not sorted</div>
      <div class="sub">${loose} book${loose === 1 ? '' : 's'} with no spot</div></div></button>` : '';

  return `<div class="list">${rows}${looseRow}</div>
    <button class="btn ghost" style="margin-top:16px" onclick="showAddBins()">Add more spots</button>`;
}

function exportCSV() {
  const head = ['Title','Author','ISBN','Level','Shelf spot','Status','Student','Due'];
  const rows = state.books.map(b => {

    const st  = l ? studentById(l.student_id) : null;
    const bin = binById(b.bin_id);
    return [b.title, b.author || '', b.isbn || '', b.reading_level || '',
            bin ? bin.name : '',
            l ? 'Checked out' : 'On shelf', st ? fullName(st) : '',
            l ? new Date(l.due_at).toLocaleDateString() : ''];
  });
  downloadCSV('classroom-library.csv', head, rows);

/* Every checkout ever, finished and current */
function exportHistoryCSV() {
  const head = ['Student','Book','Author','Checked out','Due','Returned','Days kept','Status'];
  const all  = [...state.loans, ...state.history]
    .sort((a, b) => new Date(b.checked_out_at) - new Date(a.checked_out_at));

  if (!all.length) return toast('Nothing to export yet', 'bad');

  const rows = all.map(l => {
    const st = studentById(l.student_id);
    const b  = bookById(l.book_id) || { title: 'Unknown book', author: '' };
    const d  = ms => ms ? new Date(ms).toLocaleDateString() : '';
    return [st ? fullName(st) : '', b.title, b.author || '',
            d(l.checked_out_at), d(l.due_at), d(l.returned_at),
            l.returned_at ? daysKept(l).replace(/ days?$/, '') : '',
            l.returned_at ? 'Returned' : 'Out now'];
  });

  downloadCSV('checkout-log.csv', head, rows);
}

function downloadCSV(name, head, rows) {
  const csv = [head, ...rows]
    .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = name;
  a.click();
}

/* ---------------- render + tabs ---------------- */
const TITLES = { scan:'Scan', books:'Books', students:'My Class', due:'Checked Out', settings:'Setup' };

function render() {
  $('#barTitle').textContent = TITLES[state.tab];
  $('#barWho').textContent = state.teacher.display_name + (state.teacher.room ? ' · Room ' + state.teacher.room : '');

  const html = { scan:renderScan, books:renderBooks, students:renderStudents, due:renderDue, settings:renderSettings }[state.tab]();
  const el = $('#view-' + state.tab);
  el.innerHTML = html;
  $$('main .view').forEach(v => v.hidden = v.id !== 'view-' + state.tab);

  // overdue badge on the Due tab
  const dueBtn = $('nav#tabbar button[data-tab="due"]');
  dueBtn.querySelector('.badge')?.remove();
  const late = overdueLoans().length;
  if (late) {
    const s = document.createElement('span');
    s.className = 'badge'; s.textContent = late;
    dueBtn.prepend(s);
  }

  // per-view wiring
  if (state.tab === 'scan') {
    $('#scanStart')?.addEventListener('click', startScan);
  }
  if (state.tab === 'books') {
    $$('[data-mode]').forEach(b => b.addEventListener('click', () => {
      booksMode = b.dataset.mode; openBin = undefined; render();
    }));
    $$('[data-bin]').forEach(b => b.addEventListener('click', () => {
      openBin = b.dataset.bin === '__none' ? null : b.dataset.bin; render();
    }));
    $('#binBack')?.addEventListener('click', () => { openBin = undefined; render(); });

    const box = $('#bookSearch');
    if (!box) return;
    box.addEventListener('input', e => {
      bookQuery = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const nb = $('#bookSearch'); nb.focus(); nb.setSelectionRange(pos, pos);
    });
    $$('[data-filter]').forEach(b => b.addEventListener('click', () => { bookFilter = b.dataset.filter; render(); }));
  }
  if (state.tab === 'settings') {
    $('#setSave').addEventListener('click', () => saveSettings({
      display_name: $('#setName').value.trim() || 'Teacher',
      room: $('#setRoom').value.trim() || null,
      checkout_days: +$('#setDays').value,
      max_books: +$('#setMax').value,
    }));
    $('#setExport').addEventListener('click', exportCSV);
    $('#setExportLog').addEventListener('click', exportHistoryCSV);

    $('#setSound').addEventListener('click', e => {
      const on = !e.currentTarget.classList.contains('on');
      e.currentTarget.classList.toggle('on', on);
      setSound(on);
      toast(on ? 'Sounds on' : 'Sounds off');
    });

    $('#setSoundTest').addEventListener('click', async () => {
      if (!soundOn) return toast('Turn sounds on first', 'bad');
      const steps = [['read','Barcode read'], ['added','Added to the library'],
                     ['out','Checked out'], ['back','Brought back'], ['error','Something is wrong']];
      for (const [tone, label] of steps) {
        toast(label);
        play(tone);
        await new Promise(r => setTimeout(r, 900));
      }
    });
  }
}

function go(tab) {
  if (state.tab === 'scan' && tab !== 'scan') stopScan();
  state.tab = tab;
  $$('nav#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  window.scrollTo(0, 0);
  render();
}
$$('nav#tabbar button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

/* ---------------- boot ---------------- */
async function boot() {
  const { data } = await db.auth.getSession();
  if (!data.session) { $('#authView').hidden = false; $('#mainView').hidden = true; return; }
  state.user = data.session.user;
  $('#authView').hidden = true;
  $('#mainView').hidden = false;
  await loadAll();
  render();
}

setAuthMode('in');
boot();
</script>
</body>
</html>
